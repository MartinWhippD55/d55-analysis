# A trimmed worked example: a tiny 2-dimension / 2-module programme used by the
# bundle's own end-to-end and portability checks. Patterns, not full prose.
name: "Example Readiness Programme"
slug: example
one_liner: "Assess, teach, prove, scale — we leave, you keep the capability."
manual_sections:
  - "1. Mandate & Measurement"
  - "3. Shipping Safely"

dimensions:
  - name: "Leadership & Mandate"
    short: "Leadership"
    description: "Is there executive sponsorship, or are teams going it alone?"
    levels:
      - "Absent — no leadership acknowledgement"
      - "Aware — known but no position"
      - "Endorsed — sponsor + budget, adoption optional"
      - "Mandated — expected way of working, KPIs exist"
      - "Strategic — a stated competitive advantage"
    must_ask:
      - "Who sponsors this, and is it optional, encouraged, or mandated?"
      - "Has the investment case been made to the board?"
    go_deeper:
      - "Who would fight for the budget if it were cut?"
  - name: "Governance, Security & Compliance"
    short: "Governance"
    description: "Are guardrails in place so teams can move fast safely?"
    levels:
      - "Absent — no policy or controls"
      - "Ad-hoc — informal practices"
      - "Defined — policy exists, patchy enforcement"
      - "Controlled — enforced controls + audit trail"
      - "Optimised — continuous, measured governance"
    must_ask:
      - "Is there an approved-tool policy and an audit trail?"
      - "How is sensitive data kept out of third-party tools?"
    go_deeper:
      - "Where would a regulator find a gap today?"

modules:
  - id: 1
    slug: leadership-and-investment-case
    title: "Leadership & the Investment Case"
    dimensions_covered: ["Leadership & Mandate"]
    manual_section: "1. Mandate & Measurement"
    trigger:
      recommend_when_current_at_or_below: 2
      include_when_gap_at_or_above: 2
      prioritise_when_gap_at_or_above: 2
    audience: ["CEO / MD", "CTO", "CFO"]
    duration: "Half day"
    format: "Facilitated exec session"
    sets_up_embed: true
    objective: "Turn ambition into a sponsored, measured initiative with a defensible case."
    why: "Without mandate and measurement, adoption stalls and can't be defended."
    who: "Exec sponsor, CTO, finance."
    inputs: ["Current vs target on Leadership & Mandate", "Any existing metrics"]
    session_flow: ["Frame the mandate", "Build the investment case", "Agree the scorecard"]
    deliverables: ["Investment Case One-Pager", "Metrics Scorecard"]
    writes_to_manual: "The mandate, sponsor, investment case, and scorecard."
    embed: "Sets the metrics baseline the embed proves against."
  - id: 3
    slug: shipping-safely
    title: "Shipping Safely"
    dimensions_covered: ["Governance, Security & Compliance"]
    manual_section: "3. Shipping Safely"
    trigger:
      recommend_when_current_at_or_below: 3
      include_when_gap_at_or_above: 2
      prioritise_when_gap_at_or_above: 2
      critical_dimensions: ["Governance, Security & Compliance"]
      critical_when_current_at_or_below: 2
    audience: ["Eng leads", "Security", "Compliance"]
    duration: "1 day"
    format: "Working session + policy drafting"
    sets_up_embed: true
    objective: "Put guardrails in place so leadership can authorise scaling with confidence."
    why: "Going fast without controls creates risk faster; governance enables speed."
    who: "Engineering, security, compliance."
    inputs: ["Current vs target on Governance", "Existing policies"]
    session_flow: ["Draft the usage policy", "Define controls + audit", "Classify risk"]
    deliverables: ["AI Usage Policy", "Governance Checklist"]
    writes_to_manual: "The usage policy, controls, and audit approach."
    embed: "Gives the embed a safe envelope to work within."
