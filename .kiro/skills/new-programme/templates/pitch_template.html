<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#0d0d1a; padding:24px; }
  .slide {
    width:960px; height:540px; margin:0 auto 40px; border-radius:6px; overflow:hidden;
    position:relative; box-shadow:0 8px 32px rgba(0,0,0,0.4);
    background:linear-gradient(135deg,#1a0a3e 0%,#1c1458 30%,#1e2a6e 70%,#0a4a8c 100%);
    color:#fff; padding:48px 56px; display:flex; flex-direction:column;
  }
  .slide .logo { position:absolute; top:24px; right:28px; height:36px; z-index:2; }
  .slide-number { position:absolute; bottom:16px; right:24px; font-size:11px; color:rgba(255,255,255,0.35); z-index:2; }
  .eyebrow { font-size:13px; font-weight:300; letter-spacing:2px; text-transform:uppercase; opacity:.8; margin-bottom:14px; }
  h1 { font-size:44px; font-weight:700; line-height:1.15; margin-bottom:16px; max-width:70%; }
  h2 { font-size:30px; font-weight:700; margin-bottom:20px; }
  .subtitle { font-size:18px; font-weight:300; opacity:.9; max-width:70%; }
  .statement { font-size:26px; font-weight:300; line-height:1.5; max-width:82%; margin:auto 0; }
  .statement strong { font-weight:700; color:#7fd7ff; }
  ul { list-style:none; margin-top:8px; }
  li { position:relative; padding-left:26px; margin-bottom:14px; font-size:18px; line-height:1.45; }
  li::before { content:'\203A'; position:absolute; left:0; top:0; color:#00E5CC; font-weight:bold; font-size:22px; line-height:1.2; }
  .pipeline { display:flex; align-items:stretch; gap:10px; margin-top:24px; }
  .pipeline .step { flex:1; text-align:center; background:rgba(255,255,255,0.08); border:1px solid rgba(127,215,255,0.4);
    border-radius:8px; padding:22px 10px; font-size:18px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .pipeline .arrow { color:#00E5CC; font-size:22px; align-self:center; }
  .gap-row { display:flex; justify-content:space-between; font-size:18px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.12); }
  .gap-row .g { color:#7fd7ff; font-weight:700; }
  .slide-title { background-image:url('__BG_DATA_URI__'); background-size:cover; background-position:center; justify-content:center; }
  .slide-title::after { content:''; position:absolute; inset:0; z-index:0;
    background:linear-gradient(135deg,rgba(26,10,62,0.82) 0%,rgba(28,20,88,0.62) 50%,rgba(10,74,140,0.5) 100%); }
  .slide-title > * { position:relative; z-index:1; }
  .cta { margin-top:auto; font-size:22px; font-weight:600; color:#00E5CC; }
</style>
</head>
<body>
__SLIDES__
<script>
  // Auto-scale to fill the viewport width (preserve 16:9, cap ~1.9x). Uses zoom, not transform.
  function fit() {
    var scale = Math.min(1.9, window.innerWidth / 1008);
    document.body.style.zoom = scale > 0 ? scale : 1;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
