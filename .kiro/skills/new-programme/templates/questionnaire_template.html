<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:#0066FF; --purple:#7B2FFF; --cyan:#00E5CC;
    --dark:#0f1117; --card:#1a1b23; --border:#2a2b35;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --crit:#ef4444; --high:#f59e0b; --std:#38bdf8;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:var(--dark); color:var(--text); line-height:1.6; min-height:100vh; }
  .container { max-width:1000px; margin:0 auto; padding:2rem 1.5rem; }
  header { text-align:center; margin-bottom:2.5rem; }
  header img.logo { height:40px; margin-bottom:1.25rem; }
  header h1 { font-size:2rem; font-weight:700;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  header p { color:var(--muted); }
  .dim { background:var(--card); border:1px solid var(--border); border-radius:12px;
         padding:1.5rem 1.75rem; margin-bottom:1.25rem; }
  .dim h2 { font-size:1.2rem; color:#f1f5f9; margin-bottom:.25rem; }
  .dim .desc { color:var(--muted); font-size:.95rem; margin-bottom:1rem; }
  .row { display:flex; gap:2rem; flex-wrap:wrap; }
  .field label { display:block; font-size:.8rem; text-transform:uppercase;
    letter-spacing:.05em; color:var(--dim); margin-bottom:.4rem; }
  .field select { background:var(--dark); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:.5rem .75rem; font-size:1rem; min-width:9rem; }
  button.cta { display:block; width:100%; margin:1rem 0 2.5rem; padding:.9rem;
    font-size:1.05rem; font-weight:600; color:#fff; border:none; border-radius:10px;
    cursor:pointer; background:linear-gradient(135deg,var(--blue),var(--purple)); }
  #results { margin-top:1rem; }
  #results[hidden] { display:none; }
  .radar-wrap { text-align:center; margin-bottom:2rem; }
  canvas { max-width:100%; }
  .rec { background:var(--card); border:1px solid var(--border); border-left-width:4px;
    border-radius:0 10px 10px 0; padding:1rem 1.25rem; margin-bottom:.9rem; }
  .rec.critical { border-left-color:var(--crit); }
  .rec.high { border-left-color:var(--high); }
  .rec.standard { border-left-color:var(--std); }
  .rec h3 { font-size:1.05rem; margin-bottom:.25rem; }
  .badge { display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; padding:.15rem .5rem; border-radius:4px; color:#fff; margin-bottom:.4rem; }
  .badge.critical { background:var(--crit); } .badge.high { background:var(--high); }
  .badge.standard { background:var(--std); }
  .rec .reason { color:var(--muted); font-size:.9rem; }
  .empty { color:var(--muted); text-align:center; padding:2rem; }
  h2.section { font-size:1.4rem; margin:2rem 0 1rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <img class="logo" src="__LOGO_DATA_URI__" alt="logo">
    <h1>__PROGRAMME_NAME__</h1>
    <p>__ONE_LINER__</p>
  </header>

  <div id="form"></div>
  <button class="cta" id="compute">See my results</button>

  <div id="results" hidden>
    <h2 class="section">Your readiness radar</h2>
    <div class="radar-wrap"><canvas id="radar" width="540" height="540"></canvas></div>
    <h2 class="section">Recommended modules</h2>
    <div id="recommendations"></div>
  </div>
</div>

<script>
const PROGRAMME = __PROGRAMME_JSON__;
const DIMENSIONS = __DIMENSIONS_JSON__;
const MODULES = __MODULES_JSON__;

// --- Shared recommendation logic (MUST mirror engine/recommend.py exactly) ---
function recommendModules(assessment, modules) {
  const scoreFor = (dim) => assessment.scores.find(s => s.dimension === dim);
  const results = [];
  for (const m of modules) {
    const covered = m.dimensions_covered || [];
    const t = m.trigger || {};
    const criticalDims = new Set(t.critical_dimensions || []);
    let included = false, critical = false;
    for (const d of covered) {
      const s = scoreFor(d);
      const gap = s.target - s.current;
      if (t.recommend_when_current_at_or_below != null && s.current <= t.recommend_when_current_at_or_below) included = true;
      if (t.include_when_gap_at_or_above != null && gap >= t.include_when_gap_at_or_above) included = true;
      if (t.critical_when_current_at_or_below != null && criticalDims.has(d) && s.current <= t.critical_when_current_at_or_below) { included = true; critical = true; }
    }
    if (!included) continue;
    let high = false;
    for (const d of covered) {
      const s = scoreFor(d);
      if (t.prioritise_when_gap_at_or_above != null && (s.target - s.current) >= t.prioritise_when_gap_at_or_above) high = true;
    }
    const status = critical ? "critical" : (high ? "high" : "standard");
    const id = (m.id != null) ? m.id : m.module_id;
    results.push({ module_id: id, status: status });
  }
  return results;
}
// Expose for parity testing.
window.recommendModules = recommendModules;
window.MODULES = MODULES;
window.DIMENSIONS = DIMENSIONS;

// --- Build the form ---
const scores = {};
function buildForm() {
  const form = document.getElementById('form');
  DIMENSIONS.forEach(d => {
    scores[d.name] = { current: 1, target: 3 };
    const card = document.createElement('div');
    card.className = 'dim';
    const levels = (d.levels || []).map((l, i) => `${i + 1} — ${l}`);
    const opts = (sel) => [1,2,3,4,5].map(v =>
      `<option value="${v}" ${v === sel ? 'selected' : ''}>${levels[v-1] || v}</option>`).join('');
    card.innerHTML = `
      <h2>${d.title}</h2>
      <div class="desc">${d.description || ''}</div>
      <div class="row">
        <div class="field"><label>Current</label>
          <select data-dim="${d.name}" data-kind="current">${opts(1)}</select></div>
        <div class="field"><label>Target</label>
          <select data-dim="${d.name}" data-kind="target">${opts(3)}</select></div>
      </div>`;
    form.appendChild(card);
  });
  form.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', e => {
      const { dim, kind } = e.target.dataset;
      scores[dim][kind] = parseInt(e.target.value, 10);
    });
  });
}

function getAssessment() {
  return { scores: DIMENSIONS.map(d => ({ dimension: d.name, current: scores[d.name].current, target: scores[d.name].target })) };
}

// --- Custom, dependency-free radar (self-contained; no CDN) ---
function drawRadar(assessment) {
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 80;
  const n = DIMENSIONS.length;
  ctx.clearRect(0, 0, W, H);
  const angle = (i) => -Math.PI/2 + i * 2*Math.PI/n;
  const pt = (val, i) => [cx + R*val/5*Math.cos(angle(i)), cy + R*val/5*Math.sin(angle(i))];

  // rings
  ctx.strokeStyle = '#2a2b35'; ctx.fillStyle = '#94a3b8'; ctx.lineWidth = 1;
  for (let ring = 1; ring <= 5; ring++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) { const [x,y] = pt(ring, i % n); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.stroke();
  }
  // axes + labels
  ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  DIMENSIONS.forEach((d, i) => {
    const [x,y] = pt(5, i); ctx.strokeStyle = '#2a2b35';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    const [lx,ly] = pt(6.1, i); ctx.fillStyle = '#94a3b8';
    ctx.fillText(d.short || d.title, lx, ly);
  });
  const poly = (kind, stroke, fill, dash) => {
    ctx.beginPath(); ctx.setLineDash(dash || []);
    assessment.scores.forEach((s, i) => { const [x,y] = pt(s[kind], i); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);
  };
  poly('target', '#7B2FFF', 'rgba(123,47,255,0.12)', [6,4]);
  poly('current', '#0066FF', 'rgba(0,102,255,0.20)');
}

function renderRecommendations(assessment) {
  const recs = recommendModules(assessment, MODULES);
  const order = { critical: 0, high: 1, standard: 2 };
  recs.sort((a,b) => order[a.status] - order[b.status]);
  const titleFor = (id) => { const m = MODULES.find(x => (x.id != null ? x.id : x.module_id) === id); return m ? m.title : ('Module ' + id); };
  const el = document.getElementById('recommendations');
  if (!recs.length) { el.innerHTML = '<div class="empty">No modules triggered — strong across the board. Talk to us about scaling.</div>'; return; }
  el.innerHTML = recs.map(r => `
    <div class="rec ${r.status}">
      <span class="badge ${r.status}">${r.status}</span>
      <h3>${titleFor(r.module_id)}</h3>
      <div class="reason">${r.status === 'critical' ? 'A hard gate on a critical dimension fired.' : r.status === 'high' ? 'A large gap makes this a high priority.' : 'Recommended based on your current maturity.'}</div>
    </div>`).join('');
}

document.getElementById('compute').addEventListener('click', () => {
  const assessment = getAssessment();
  document.getElementById('results').hidden = false;
  drawRadar(assessment);
  renderRecommendations(assessment);
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
});

buildForm();
</script>
</body>
</html>
