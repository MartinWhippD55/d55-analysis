<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCREEN NAME - Wireframe</title>
    <!--
      Style options:
        A) link the kit (simplest): copy wireframe.css next to your mockups.
           <link rel="stylesheet" href="wireframe.css">
        B) fully standalone file: paste the contents of wireframe.css inside
           a <style> tag below instead of the <link>.
      Add per-screen tweaks (field positions, widths) in the <style> block.
    -->
    <link rel="stylesheet" href="wireframe.css">
    <style>
        /* per-screen overrides go here */
    </style>
</head>
<body>
    <div class="wireframe-label">WIREFRAME - layout only</div>

    <div class="container">
        <div class="header">
            <h1>Screen Title</h1>
            <button class="btn">+ Primary Action</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:40px;"></th>
                    <th style="width:50px;">#</th>
                    <th>Item</th>
                    <th style="width:200px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="drag-handle">&#x22EE;&#x22EE;</span></td>
                    <td><span class="chip">1</span></td>
                    <td>Example row with realistic sample data</td>
                    <td>
                        <button class="btn-sm">Edit</button>
                        <button class="btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="note">Footnote / helper text explaining a key interaction.</div>
    </div>
</body>
</html>
