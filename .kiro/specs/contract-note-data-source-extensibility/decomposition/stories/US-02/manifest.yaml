id: US-02
title: Glue Data Catalog discovery client
userStory: As a Business_User, I want the system to discover the Glue tables available
  to the Project Role (filtered to those joinable by bryt_number) with their columns,
  so that subscribed data sources become usable without code changes.
coversRequirements:
- '1'
exports:
- shared-lib:glue-catalog-client
dependsOn:
- shared-lib:data-source-types
- cdk-construct:project-role-trust-policy
subtasks:
- id: US-02-1
  title: 'Implement Glue catalog client: AssumeRole -> Project Role creds, list databases/tables,
    filter to bryt_number tables, return AvailableDataSource[] with columns'
  requirements:
  - '1'
  optional: false
- id: US-02-2
  title: 'Implement column detail fetcher: full column list (name, type) for a specific
    {database}/{table}'
  requirements:
  - '3'
  - '7'
  optional: false
- id: US-02-3
  title: 'Property tests for discovery (Property 1: only bryt_number tables discoverable;
    Property 11: new subscriptions immediately discoverable)'
  requirements:
  - '1'
  - '6'
  optional: true
jira:
  issueType: Story
  epic: contract-note-data-source-extensibility
  labels:
  - backend
  estimateDays: 1.0
