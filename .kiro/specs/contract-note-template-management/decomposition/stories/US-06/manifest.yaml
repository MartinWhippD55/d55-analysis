id: US-06
title: Render pipeline (Step Functions)
userStory: As a Business_User, I want contract data to be rendered to a PDF automatically
  via an orchestrated pipeline that selects the template, resolves pinned versions,
  picks section variants, renders and stitches, so that contract notes are produced
  reliably.
