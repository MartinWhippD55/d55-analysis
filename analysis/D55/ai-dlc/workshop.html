<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readiness Assessment — D55</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --d55-blue: #0066FF;
            --d55-purple: #7B2FFF;
            --d55-cyan: #00E5CC;
            --d55-dark: #0f1117;
            --d55-card: #1a1b23;
            --d55-border: #2a2b35;
            --d55-text: #e2e8f0;
            --d55-muted: #94a3b8;
            --d55-dim: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--d55-dark);
            color: var(--d55-text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .d55-logo {
            height: 40px;
            margin-bottom: 1.5rem;
        }
        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--d55-blue), var(--d55-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--d55-muted);
            font-size: 1rem;
        }
        .progress-bar {
            background: var(--d55-card);
            border-radius: 9999px;
            height: 6px;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .progress-bar .fill {
            background: linear-gradient(90deg, var(--d55-blue), var(--d55-purple));
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s ease;
        }
        .step-indicator {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .dimension-card {
            background: var(--d55-card);
            border: 1px solid var(--d55-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .dimension-card.active { display: block; }
        .dimension-card h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }
        .dimension-card .description {
            color: var(--d55-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .scoring-section {
            margin-bottom: 1.5rem;
        }
        .scoring-section h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--d55-dim);
            margin-bottom: 0.75rem;
        }
        .score-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .score-btn {
            background: var(--d55-dark);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--d55-text);
            cursor: pointer;
            flex: 1;
            min-width: 140px;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .score-btn:hover {
            border-color: var(--d55-blue);
            background: #1a1b2e;
        }
        .score-btn.selected-current {
            border-color: var(--d55-blue);
            background: rgba(0, 102, 255, 0.12);
            box-shadow: 0 0 0 1px var(--d55-blue);
        }
        .score-btn.selected-target {
            border-color: var(--d55-cyan);
            background: rgba(0, 229, 204, 0.1);
            box-shadow: 0 0 0 1px var(--d55-cyan);
        }
        .score-btn .score-num {
            font-weight: 700;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.25rem;
        }
        .questions-panel {
            background: var(--d55-dark);
            border: 1px solid var(--d55-border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 1.5rem;
        }
        .questions-panel h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--d55-dim);
            margin-bottom: 0.75rem;
        }
        .questions-panel ul {
            list-style: none;
            padding: 0;
        }
        .questions-panel li {
            padding: 0.4rem 0;
            color: var(--d55-muted);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--d55-card);
        }
        .questions-panel li:last-child { border-bottom: none; }
        .notes-area {
            margin-top: 1.25rem;
        }
        .notes-area textarea {
            width: 100%;
            background: var(--d55-dark);
            border: 1px solid var(--d55-border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--d55-text);
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
        }
        .notes-area textarea:focus {
            outline: none;
            border-color: var(--d55-blue);
        }
        .notes-area label {
            font-size: 0.85rem;
            color: var(--d55-dim);
            display: block;
            margin-bottom: 0.5rem;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-secondary:hover { background: #475569; }
        .btn-primary {
            background: linear-gradient(135deg, var(--d55-blue), var(--d55-purple));
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Results page */
        #results { display: none; }
        #results.active { display: block; }
        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .results-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .chart-container {
            background: var(--d55-card);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--d55-muted);
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .gap-analysis {
            margin-top: 2rem;
        }
        .gap-analysis h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }
        .gap-item {
            background: var(--d55-card);
            border: 1px solid var(--d55-border);
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .gap-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .gap-item-header h4 {
            font-size: 1rem;
            color: #f1f5f9;
        }
        .gap-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
        }
        .gap-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .gap-medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
        .gap-low { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .gap-none { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
        .gap-scores {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .gap-services h5 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        .service-tag {
            display: inline-block;
            background: var(--d55-dark);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin: 0.2rem 0.2rem 0.2rem 0;
        }
        .engagement-models {
            background: var(--d55-card);
            border: 1px solid var(--d55-border);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
        }
        .engagement-models h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }
        .engagement-models > p {
            color: var(--d55-muted);
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }
        .engagement-option {
            background: var(--d55-dark);
            border: 1px solid var(--d55-border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .engagement-option h4 {
            color: #f1f5f9;
            margin-bottom: 0.4rem;
        }
        .engagement-option p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .engagement-option .price {
            color: var(--d55-cyan);
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }
        .recommended {
            border-color: var(--d55-purple);
            box-shadow: 0 0 0 1px rgba(123, 47, 255, 0.3);
        }
        .recommended::before {
            content: "Recommended based on your gaps";
            display: block;
            font-size: 0.75rem;
            color: var(--d55-purple);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .runbook-section {
            background: var(--d55-card);
            border: 1px solid var(--d55-border);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
        }
        .runbook-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }
        .runbook-phase {
            border-left: 3px solid #475569;
            padding-left: 1.25rem;
            margin-bottom: 1.25rem;
        }
        .runbook-phase.priority-high { border-color: #ef4444; }
        .runbook-phase.priority-medium { border-color: #f59e0b; }
        .runbook-phase.priority-low { border-color: #22c55e; }
        .runbook-phase h4 {
            color: #f1f5f9;
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }
        .runbook-phase p {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            .score-options { flex-direction: column; }
            .score-btn { min-width: auto; }
        }
    </style>
</head>

    },
    {
        id: "team",
        title: "Team Adaptation & Skills",
        description: "Are people adapting \u2014 or are coordination roles becoming bottlenecks and resistance blocking adoption?",
        levels: [

        ],
        questions: [

            "How long for a new joiner to become productive with AI tooling?"
        ],
        services: ["Four Fears Diagnostic & Intervention", "Upskilling Programme", "Role Redefinition Coaching"]
    },
    {
        id: "metrics",
        title: "Metrics & ROI",
        description: "Can you prove AI-assisted development is working \u2014 with numbers, not vibes?",
        levels: [
            "Unmeasured \u2014 No metrics on impact. \u2018It feels faster\u2019 but no evidence.",
            "Anecdotal \u2014 Individual testimonials. Cannot make the case to finance.",

        ],
        questions: [
            "How do you know AI-assisted development is working? What evidence?",
            "If the CFO asked \u2018what are we getting for AI tooling spend?\u2019 \u2014 what would you say?",

            "Have you quantified the ROI in \u00a3 terms?",
            "What would it take to make the case for doubling the investment?",

// State
let currentStep = 0;
const scores = {};
dimensions.forEach(d => { scores[d.id] = { current: null, target: null, notes: "" }; });

function renderDimensions() {
    const container = document.getElementById('dimensions-container');
    container.innerHTML = dimensions.map((dim, i) => `
        <div class="dimension-card ${i === 0 ? 'active' : ''}" data-step="${i}">
            <h2>${dim.title}</h2>
            <p class="description">${dim.description}</p>
            
            <div class="scoring-section">
                <h3>Where are you today?</h3>
                <div class="score-options" data-dimension="${dim.id}" data-type="current">
                    ${dim.levels.map((level, li) => `
                        <button class="score-btn" data-score="${li + 1}">
                            <span class="score-num">${li + 1}</span>
                            ${level}
                        </button>
                    `).join('')}
                </div>
            </div>

            <div class="scoring-section">
                <h3>Where do you want to be in 12–18 months?</h3>
                <div class="score-options" data-dimension="${dim.id}" data-type="target">
                    ${dim.levels.map((level, li) => `
                        <button class="score-btn" data-score="${li + 1}">
                            <span class="score-num">${li + 1}</span>
                            ${level}
                        </button>
                    `).join('')}
                </div>
            </div>

            <div class="questions-panel">
                <h3>Discussion prompts</h3>
                <ul>
                    ${dim.questions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            </div>

            <div class="notes-area">
                <label for="notes-${dim.id}">Notes from conversation</label>
                <textarea id="notes-${dim.id}" placeholder="Capture key points, quotes, context..." 
                    oninput="scores['${dim.id}'].notes = this.value"></textarea>
            </div>
        </div>
    `).join('');

    // Bind score button clicks
    container.querySelectorAll('.score-options').forEach(group => {
        const dimId = group.dataset.dimension;
        const type = group.dataset.type;
        group.querySelectorAll('.score-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                group.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected-current', 'selected-target'));
                btn.classList.add(type === 'current' ? 'selected-current' : 'selected-target');
                scores[dimId][type] = parseInt(btn.dataset.score);
            });
        });
    });
}

function updateUI() {
    // Progress
    const progress = ((currentStep + 1) / dimensions.length) * 100;
    document.getElementById('progress-fill').style.width = `${progress}%`;
    document.getElementById('step-indicator').textContent = `${currentStep + 1} of ${dimensions.length} — ${dimensions[currentStep].title}`;

    // Cards
    document.querySelectorAll('.dimension-card').forEach((card, i) => {
        card.classList.toggle('active', i === currentStep);
    });

    // Buttons
    document.getElementById('btn-prev').disabled = currentStep === 0;
    const nextBtn = document.getElementById('btn-next');
    if (currentStep === dimensions.length - 1) {
        nextBtn.textContent = 'See Results →';
    } else {
        nextBtn.textContent = 'Next →';
    }
}

function showResults() {
    document.getElementById('assessment').style.display = 'none';
    document.getElementById('results').classList.add('active');
    renderRadarChart();
    renderGapAnalysis();
    renderEngagementModels();
    renderRunbook();
}

function renderRadarChart() {
    const ctx = document.getElementById('radar-chart').getContext('2d');
    const labels = dimensions.map(d => d.title);
    const currentData = dimensions.map(d => scores[d.id].current || 1);
    const targetData = dimensions.map(d => scores[d.id].target || 1);

    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Current State',
                    data: currentData,
                    borderColor: '#0066FF',
                    backgroundColor: 'rgba(0, 102, 255, 0.1)',
                    borderWidth: 2,
                    pointBackgroundColor: '#0066FF',
                    pointRadius: 4
                },
                {
                    label: 'Target State',
                    data: targetData,
                    borderColor: '#00E5CC',
                    backgroundColor: 'rgba(0, 229, 204, 0.08)',
                    borderWidth: 2,
                    pointBackgroundColor: '#00E5CC',
                    pointRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                r: {
                    min: 0,
                    max: 5,
                    ticks: { stepSize: 1, color: '#64748b', backdropColor: 'transparent' },
                    grid: { color: '#2a2b35' },
                    angleLines: { color: '#2a2b35' },
                    pointLabels: { color: '#94a3b8', font: { size: 11 } }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
}

function renderGapAnalysis() {
    const container = document.getElementById('gap-analysis');
    const gaps = dimensions.map(d => {
        const current = scores[d.id].current || 1;
        const target = scores[d.id].target || 1;
        const gap = target - current;
        return { ...d, current, target, gap };
    }).sort((a, b) => b.gap - a.gap);

    container.innerHTML = `<h3>Gap Analysis & Recommended Services</h3>` + gaps.map(g => {
        let badgeClass = 'gap-none';
        let badgeText = 'On track';
        if (g.gap >= 3) { badgeClass = 'gap-high'; badgeText = `Gap: ${g.gap}`; }
        else if (g.gap === 2) { badgeClass = 'gap-medium'; badgeText = `Gap: ${g.gap}`; }
        else if (g.gap === 1) { badgeClass = 'gap-low'; badgeText = `Gap: ${g.gap}`; }

        return `
            <div class="gap-item">
                <div class="gap-item-header">
                    <h4>${g.title}</h4>
                    <span class="gap-badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="gap-scores">
                    <span>Current: ${g.current}/5</span>
                    <span>Target: ${g.target}/5</span>
                </div>
                ${g.gap > 0 ? `
                <div class="gap-services">
                    <h5>Recommended services</h5>
                    ${g.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
                </div>` : ''}
                ${scores[g.id].notes ? `<p style="color:#94a3b8;font-size:0.85rem;margin-top:0.75rem;font-style:italic;">"${scores[g.id].notes}"</p>` : ''}
            </div>
        `;
    }).join('');
}

function renderEngagementModels() {
    const container = document.getElementById('engagement-models');
    const totalGap = dimensions.reduce((sum, d) => sum + Math.max(0, (scores[d.id].target || 1) - (scores[d.id].current || 1)), 0);
    const maxGap = Math.max(...dimensions.map(d => (scores[d.id].target || 1) - (scores[d.id].current || 1)));
    const gapCount = dimensions.filter(d => (scores[d.id].target || 1) - (scores[d.id].current || 1) > 0).length;

    // Determine recommended model
    let recommended = 'discovery';
    if (totalGap >= 16 || maxGap >= 4) recommended = 'embedded';
    else if (totalGap >= 8) recommended = 'consultancy';

    container.innerHTML = `
        <h3>How We Can Help</h3>
        <p>Based on your gaps (${gapCount} dimensions, total gap score ${totalGap}), here are the engagement models that fit:</p>

        <div style="background:#0f1117;border:1px solid #475569;border-radius:8px;padding:1rem;margin-bottom:1.5rem;">
            <p style="color:#fcd34d;font-size:0.9rem;font-weight:600;margin-bottom:0.5rem;">💡 The Economics</p>
            <p style="color:#94a3b8;font-size:0.85rem;">AI developer tooling costs ~£150–200/seat/month and delivers ~5x productivity improvement. For a 50-person engineering team, that's ~£120k/year in tooling for output equivalent to 200+ engineers. The ROI case is straightforward — the real cost is delay, not investment.</p>
        </div>

        <div class="engagement-option ${recommended === 'discovery' ? 'recommended' : ''}">
            <h4>🔍 Discovery & Strategy Session (DSD)</h4>
            <p>A focused discovery engagement to define exactly what needs to be done. The output is a data/AI strategy document — your roadmap, prioritised and costed. You buy this, and it tells you what to build and in what order.</p>
            <p class="price">Typical: £30k–£50k | Duration: 4–6 weeks</p>
        </div>

        <div class="engagement-option ${recommended === 'consultancy' ? 'recommended' : ''}">
            <h4>📋 Prescriptive Guidance & Workshops</h4>
            <p>Targeted workshops and consultancy across your gap areas. We teach your team: how to spec for AI-first delivery, developer tooling setup, compliance (correct region, locked down), changes to ceremonies and process, and how to handle the middle-layer bottleneck when devs go faster.</p>
            <p class="price">Typical: £5k–£15k per workshop | Pick what you need</p>
            <p style="color:#94a3b8;font-size:0.85rem;margin-top:0.5rem;">Modules: AI Strategy | AI-First Delivery Lifecycle | Developer Tooling | Compliance & Governance | MLOps | Process & Ceremonies | Data Platform | Cost Optimisation | Four Fears (Culture & Change)</p>
        </div>

        <div class="engagement-option ${recommended === 'embedded' ? 'recommended' : ''}">
            <h4>👥 Embedded Team / Forward Deployed Engineers</h4>
            <p>We put a team in. Forward deployed engineers working alongside your people — building, shipping, and upskilling as they go. Structured as an 8-week engagement: <strong>Weeks 1–2</strong> assess codebase, tooling, and adoption barriers. <strong>Weeks 3–6</strong> embed in a squad, apply AI-first delivery on real work, track metrics from day one. <strong>Weeks 7–8</strong> demonstrate improvement with numbers, produce playbooks, deliver rollout plan for other squads.</p>
            <p class="price">Typical: £15k–£25k per engineer/month | 8-week prove-it model or longer engagement</p>
            <p style="color:#94a3b8;font-size:0.85rem;margin-top:0.5rem;">D55 embeds, proves, then enables. Not a permanent dependency. Assets and playbooks allow teams to self-serve after we step back.</p>
        </div>

        <div class="engagement-option">
            <h4>📦 Runbook & Asset Delivery</h4>
            <p>We produce a prescriptive runbook — a step-by-step guide your team can follow to close the gaps. The runbook is the asset: it tells you exactly how to get from current state to target state, with decision points and options at each stage. Not just advice — a playbook.</p>
            <p class="price">Included with Discovery, or standalone from £20k</p>
        </div>
    `;
}

function renderRunbook() {
    const container = document.getElementById('runbook-section');
    const gaps = dimensions.map(d => {
        const current = scores[d.id].current || 1;
        const target = scores[d.id].target || 1;
        return { ...d, current, target, gap: target - current };
    }).filter(g => g.gap > 0).sort((a, b) => b.gap - a.gap);

    if (gaps.length === 0) {
        container.innerHTML = `<h3>Indicative Runbook</h3><p style="color:#94a3b8;">No gaps identified — you're already where you want to be.</p>`;
        return;
    }

    // Group into phases by priority
    const high = gaps.filter(g => g.gap >= 3);
    const medium = gaps.filter(g => g.gap === 2);
    const low = gaps.filter(g => g.gap === 1);

    container.innerHTML = `
        <h3>Indicative Runbook</h3>
        <p style="color:#94a3b8;margin-bottom:1.25rem;">Phased approach to close your gaps, ordered by impact. This becomes a detailed deliverable in the Discovery engagement.</p>
        
        ${high.length ? `
        <div class="runbook-phase priority-high">
            <h4>Phase 1 — Immediate Priority (Months 1–3)</h4>
            <p>${high.map(g => `<strong>${g.title}</strong> (${g.current}→${g.target}): ${g.services.slice(0, 2).join(', ')}`).join('<br>')}</p>
        </div>` : ''}
        
        ${medium.length ? `
        <div class="runbook-phase priority-medium">
            <h4>Phase 2 — Build Momentum (Months 3–6)</h4>
            <p>${medium.map(g => `<strong>${g.title}</strong> (${g.current}→${g.target}): ${g.services.slice(0, 2).join(', ')}`).join('<br>')}</p>
        </div>` : ''}
        
        ${low.length ? `
        <div class="runbook-phase priority-low">
            <h4>Phase 3 — Optimise & Sustain (Months 6–12)</h4>
            <p>${low.map(g => `<strong>${g.title}</strong> (${g.current}→${g.target}): ${g.services.slice(0, 2).join(', ')}`).join('<br>')}</p>
        </div>` : ''}

        <div style="margin-top:1.5rem;padding:1rem;background:#0f1117;border:1px solid #334155;border-radius:8px;">
            <p style="color:#94a3b8;font-size:0.9rem;"><strong style="color:#f1f5f9;">What's next?</strong> This indicative runbook becomes a fully detailed, costed roadmap through our Discovery & Strategy engagement. Each phase is broken down into workstreams with clear deliverables, timelines, and team requirements.</p>
        </div>
    `;
}

// Navigation
document.getElementById('btn-next').addEventListener('click', () => {
    const dim = dimensions[currentStep];
    const currentScore = scores[dim.id].current;
    const targetScore = scores[dim.id].target;

    // Validate both scores are selected
    if (currentScore === null || targetScore === null) {
        // Show validation message
        let msg = document.getElementById('validation-msg');
        if (!msg) {
            msg = document.createElement('div');
            msg.id = 'validation-msg';
            msg.style.cssText = 'color: #f87171; text-align: center; margin-top: 1rem; font-size: 0.9rem; font-weight: 500;';
            document.querySelector('.nav-buttons').before(msg);
        }
        if (currentScore === null && targetScore === null) {
            msg.textContent = 'Please select both a current state and a target state score before continuing.';
        } else if (currentScore === null) {
            msg.textContent = 'Please select a current state score before continuing.';
        } else {
            msg.textContent = 'Please select a target state score before continuing.';
        }
        return;
    }

    // Validate target >= current
    if (targetScore < currentScore) {
        let msg = document.getElementById('validation-msg');
        if (!msg) {
            msg = document.createElement('div');
            msg.id = 'validation-msg';
            msg.style.cssText = 'color: #f87171; text-align: center; margin-top: 1rem; font-size: 0.9rem; font-weight: 500;';
            document.querySelector('.nav-buttons').before(msg);
        }
        msg.textContent = 'Target state should be equal to or higher than current state.';
        return;
    }

    // Clear validation message
    const msg = document.getElementById('validation-msg');
    if (msg) msg.remove();

    if (currentStep < dimensions.length - 1) {
        currentStep++;
        updateUI();
    } else {
        showResults();
    }
});

document.getElementById('btn-prev').addEventListener('click', () => {
    // Clear validation message when going back
    const msg = document.getElementById('validation-msg');
    if (msg) msg.remove();

    if (currentStep > 0) {
        currentStep--;
        updateUI();
    }
});

// Init
renderDimensions();
updateUI();
</script>
</body>
</html>
